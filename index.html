    <div class="tree">
        <!-- Leaves - Top layer (1 block wide) -->
        <div class="leaves-row">
            <div class="block leaf"></div>
        </div>

        <!-- Leaves - Second layer (3 blocks wide) -->
        <div class="leaves-row">
            <div class="block leaf"></div>
            <div class="block leaf"></div>
            <div class="block leaf"></div>
        </div>

        <!-- Leaves - Third layer (5 blocks wide) -->

            <div class="block leaf"></div>
            <div class="block leaf"></div>
            <div class="block leaf"></div>
            <div class="block leaf"></div>
            <div class="block leaf"></div>
        </div>

            <div class="block leaf"></div>
            <div class="block leaf"></div>
            <div class="block leaf"></div>
            <div class="block leaf"></div>
        </div>

            <div class="block leaf"></div>
            <div class="block leaf"></div>
            <div class="block leaf"></div>
            <div class="block leaf"></div>
        </div>

        <!-- Leaves - Sixth layer (3 blocks wide) -->
        <div class="leaves-row">
            <div class="block leaf"></div>
            <div class="block leaf"></div>
            <div class="block leaf"></div>
        </div>
