<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beaver &amp; the Tree</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===================== INTRO SCENE ===================== -->
    <div class="intro" id="intro">
        <div class="sky">
            <div class="sun"></div>
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
        </div>
        <div class="ground"></div>

        <!-- Everything anchored to the tree's spot on the left -->
        <div class="tree-spot" id="treeSpot">
            <div class="stump" id="stump"></div>
            <div class="tree" id="tree">
                <div class="canopy"></div>
                <div class="trunk"></div>
            </div>
            <div class="chip chip-1"></div>
            <div class="chip chip-2"></div>
            <div class="chip chip-3"></div>
        </div>

        <!-- The beaver, walks in from the right -->
        <div class="beaver" id="beaver">
            <svg viewBox="0 0 140 110" width="140" height="110">
                <ellipse class="tail" cx="22" cy="78" rx="20" ry="24"></ellipse>
                <ellipse class="body" cx="66" cy="70" rx="40" ry="30"></ellipse>
                <ellipse class="belly" cx="68" cy="78" rx="27" ry="17"></ellipse>
                <rect class="leg back-leg" x="46" y="92" width="12" height="15" rx="5"></rect>
                <rect class="leg front-leg" x="78" y="93" width="12" height="15" rx="5"></rect>
                <circle class="head" cx="102" cy="46" r="23"></circle>
                <circle class="ear" cx="94" cy="27" r="6.5"></circle>
                <circle class="eye" cx="110" cy="41" r="3.2"></circle>
                <ellipse class="nose" cx="120" cy="49" rx="7.5" ry="5.5"></ellipse>
                <rect class="tooth" x="116" y="53" width="5.5" height="8" rx="1"></rect>
                <g class="arm-axe">
                    <rect class="arm" x="96" y="62" width="9" height="22" rx="4"></rect>
                    <g class="axe">
                        <rect class="axe-handle" x="99" y="28" width="4.5" height="38"></rect>
                        <path class="axe-head" d="M96 22 L112 22 L117 34 L101 40 Z"></path>
                    </g>
                </g>
            </svg>
        </div>

        <div class="click-prompt" id="clickPrompt">
            <span>Click anywhere to let the beaver in&hellip;</span>
        </div>
    </div>

    <!-- ===================== MAIN PAGE (hidden behind the intro) ===================== -->
    <main class="page" id="page">
        <header class="page-header">
            <h1>Welcome!</h1>
            <p>The beaver cleared the way for you.</p>
        </header>

        <section class="page-section">
            <h2>This is just a placeholder page</h2>
            <p>
                Put whatever you actually want here &mdash; this mockup is about the
                beaver-chops-a-tree intro animation, not the content underneath it.
            </p>
        </section>

        <section class="page-section">
            <button id="replayBtn" class="replay-btn">Replay the intro</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
