<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Tree Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="tree">
            <!-- Top leaves layer -->
            <div class="leaves-row leaves-top">
                <div class="block leaf"></div>
                <div class="block leaf"></div>
                <div class="block leaf"></div>
            </div>

            <!-- Second leaves layer -->
            <div class="leaves-row leaves-second">
                <div class="block leaf"></div>
                <div class="block leaf"></div>
                <div class="block leaf"></div>
                <div class="block leaf"></div>
                <div class="block leaf"></div>
            </div>

            <!-- Third leaves layer -->
            <div class="leaves-row leaves-third">
                <div class="block leaf"></div>
                <div class="block leaf"></div>
                <div class="block leaf"></div>
                <div class="block leaf"></div>
                <div class="block leaf"></div>
            </div>

            <!-- Fourth leaves layer -->
            <div class="leaves-row leaves-fourth">
                <div class="block leaf"></div>
                <div class="block leaf"></div>
                <div class="block leaf"></div>
            </div>

            <!-- Trunk -->
            <div class="trunk-row">
                <div class="block trunk"></div>
            </div>
            <div class="trunk-row">
                <div class="block trunk"></div>
            </div>
            <div class="trunk-row">
                <div class="block trunk"></div>
            </div>

            <!-- Content area inside the tree -->
            <div class="content-box">
                <h1 class="minecraft-title">MINECRAFT TREE</h1>
                <p class="minecraft-text">Welcome to the blocky world!</p>
                <div class="button-container">
                    <button class="minecraft-button">EXPLORE</button>
                    <button class="minecraft-button">CRAFT</button>
                    <button class="minecraft-button">BUILD</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
